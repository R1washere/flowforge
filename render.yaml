services:
  - type: web
    name: flowforge-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm db:generate && pnpm --filter @flowforge/api build
    startCommand: pnpm db:deploy && pnpm db:seed:production && pnpm --filter @flowforge/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: API_RATE_LIMIT_MAX
        value: "120"
      - key: DATABASE_URL
        sync: false
      - key: API_CORS_ORIGIN
        sync: false
