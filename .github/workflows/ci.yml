name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowforge
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure local test environment
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint

      - name: Verify PostgreSQL migrations, builds, API, and web routes
        run: pnpm verify
